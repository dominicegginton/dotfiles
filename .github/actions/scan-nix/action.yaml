name: Scan Nix Derivation
description: Run vulnix and vulnxscan (sbomnix) to check a built Nix derivation for CVEs, logging only exit status codes.

inputs:
  path:
    description: "The path to the built Nix derivation or store path to scan (e.g. ./result)"
    required: true
    default: "./result"

runs:
  using: "composite"
  steps:
    - name: Scan system derivation for CVEs (vulnix)
      continue-on-error: true
      run: |
        set +e
        nix run nixpkgs#vulnix -- "${{ inputs.path }}" > /dev/null 2>&1
        code=$?
        echo "vulnix scan completed with exit code: $code"
      shell: bash

    - name: Scan system derivation for CVEs (vulnxscan)
      continue-on-error: true
      run: |
        set +e
        nix shell nixpkgs#sbomnix -c vulnxscan "${{ inputs.path }}" > /dev/null 2>&1
        code=$?
        echo "vulnxscan completed with exit code: $code"
      shell: bash
