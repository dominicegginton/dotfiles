on:
  pull_request:
  push:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

env:
  NIX_CONFIG: "accept-flake-config = true"

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/install-nix
      - run: nix flake check -L

  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/install-nix
      - run: nix fmt -- --ci

  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/install-nix
      - run: nix build -L .\#packages.x86_64-linux.topology
      - uses: actions/upload-artifact@v7
        with:
          path: result/
          name: topology
          retention-days: 90
          compression-level: 0

  nix-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/install-nix
      - id: set-matrix
        name: Generate Nix Matrix
        run: |
          set -Eeu
          matrix="$(nix eval --json '.#githubActions.matrix')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  nix-build:
    name: ${{ matrix.name }} (${{ matrix.system }})
    needs: nix-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.nix-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/install-nix
        with:
          free-disk-space: true
      - run: nix build -L '.#${{ matrix.attr }}'
      - name: Upload ISO artifact
        if: contains(matrix.attr, 'infector-iso')
        uses: actions/upload-artifact@v7
        with:
          name: infector-iso
          path: result/
          retention-days: 14
      - uses: ./.github/actions/scan-nix
        continue-on-error: true
        with:
          path: ./result
