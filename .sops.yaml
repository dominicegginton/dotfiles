keys:
  # Dominic's Post-Quantum Master Age Key
  - &dom_pq 

  # Host Post-Quantum Age Keys
  - &ghost_gs60_pq 
  - &latitude_7390_pq 
  - &steamdeck_pq 
  - &steammachine_pq 

creation_rules:
  # 1. Global secrets (decryptable by all hosts and dom)
  - path_regex: secrets/global\.yaml$
    key_groups:
      - age:
          - *dom_pq
          - *ghost_gs60_pq
          - *latitude_7390_pq
          - *steamdeck_pq
          - *steammachine_pq

  # 2. ghost-gs60 specific secrets
  - path_regex: secrets/hosts/ghost-gs60\.yaml$
    key_groups:
      - age: [*dom_pq, *ghost_gs60_pq, *latitude_7390_pq]

  # 3. latitude-7390 specific secrets
  - path_regex: secrets/hosts/latitude-7390\.yaml$
    key_groups:
      - age: [*dom_pq, *latitude_7390_pq]

  # 4. steamdeck specific secrets
  - path_regex: secrets/hosts/steamdeck\.yaml$
    key_groups:
      - age: [*dom_pq, *steamdeck_pq]

  # 5. steammachine specific secrets
  - path_regex: secrets/hosts/steammachine\.yaml$
    key_groups:
      - age: [*dom_pq, *steammachine_pq]
